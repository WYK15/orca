name: Tauri Desktop Check

on:
  push:
    branches:
      - refactor/tauri-desktop
    paths:
      - src-tauri/**
      - src/desktop-host/**
      - src/renderer/src/tauri/**
      - src/shared/desktop-wire-codec*
      - config/scripts/*tauri*
      - config/vite.tauri.config.ts
      - .github/workflows/tauri-desktop-check.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to test
        required: false
        default: refactor/tauri-desktop
        type: string

permissions:
  contents: read

concurrency:
  group: tauri-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
            rust_target: aarch64-apple-darwin
            bundles: app
            artifacts: out/tauri-artifacts/*.tar.gz
          - os: windows-2022
            platform: windows-x64
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis
            artifacts: src-tauri/target/release/bundle/nsis/*.exe
          - os: windows-11-arm
            platform: windows-arm64
            rust_target: aarch64-pc-windows-msvc
            bundles: nsis
            artifacts: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.0'
          cache: pnpm
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable-${{ matrix.rust_target }} --profile minimal --no-self-update --force-non-host
          rustup default stable-${{ matrix.rust_target }}
      - name: Install dependencies for Node
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build native dependencies for Node
        run: pnpm rebuild node-pty @parcel/watcher
      - name: Build Windows registry dependency
        if: runner.os == 'Windows'
        run: pnpm rebuild windows-native-registry
      - name: Check types
        run: pnpm typecheck:node && pnpm typecheck:web
      - name: Test standalone backend and save barrier
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/desktop-host/stdio-rpc.test.ts
          src/shared/desktop-wire-codec.test.ts
          src/renderer/src/tauri/host-transport.test.ts
          src/renderer/src/tauri/window-close-barrier.test.ts
          config/scripts/tauri-backend-smoke.test.mjs
      - name: Build unsigned test application
        run: pnpm build:tauri --bundles ${{ matrix.bundles }} --no-sign
      - name: Archive macOS application with executable permissions
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p out/tauri-artifacts
          tar -czf out/tauri-artifacts/orcaw-tauri-macos-arm64.tar.gz -C src-tauri/target/release/bundle/macos "Orcaw Tauri.app"
      - uses: actions/upload-artifact@v6
        with:
          name: tauri-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          retention-days: 14
          if-no-files-found: error
